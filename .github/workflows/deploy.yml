# ============================================================================
# DomainRAG Ops — 자동 배포 (docker compose 기반)
# ============================================================================
# 192.168.0.115 (PostgreSQL + 배포 호스트), 174번은 vLLM/embedding 별도 (수동).
#
# authfusion-platform deploy.yml 패턴 그대로 차용 (2026-05-13).
#
# 운영 사실:
#  - 115번 PostgreSQL 16 인스턴스가 이미 가동 중. AuthFusion 의 docker compose
#    `ai_aware_sse_postgres` (또는 동등) 컨테이너를 공유. DomainRAG는 별도
#    `domainrag` database + 두 role(domainrag_app/domainrag_platform_admin)로 접속.
#  - 따라서 본 배포는 backend 컨테이너 + Qdrant + MinIO 만 다룬다. postgres는 건드리지
#    않는다. 신규 PostgreSQL 컨테이너를 띄우는 첫 배포는 별도 절차(ADR-019 §2 init).
#  - alembic 마이그레이션은 backend 컨테이너가 startup 시 자동 실행되거나 별도 step
#    (현재는 별도 step — backend 가 alembic upgrade head 후 uvicorn 기동).
# ============================================================================
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      services:
        description: '재배포할 docker compose 서비스 (공백 구분, 기본 backend + 의존 인프라)'
        required: false
        default: 'backend qdrant minio'
        type: string
      skip_build:
        description: '이미지 재빌드 건너뛰기 (이미 빌드된 이미지로 재시작만)'
        required: false
        default: false
        type: boolean
      run_migrations:
        description: 'alembic upgrade head 실행 (schema 변경 배포 시)'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/ju/domainrag-ops

            SERVICES="${{ inputs.services }}"
            SKIP_BUILD="${{ inputs.skip_build }}"
            RUN_MIGRATIONS="${{ inputs.run_migrations }}"

            echo "=== [1/6] git sync ==="
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1

            echo ""
            echo "=== [2/6] PostgreSQL 가용성 확인 (외부 인스턴스 공유) ==="
            # AuthFusion의 postgres 컨테이너 또는 호스트 PG 인스턴스가 5432에 listen 중인지
            # 검사. 본 배포는 postgres를 생성하지 않는다 (ADR-019 §1 — 기존 115번 PG 공유).
            if ! pg_isready -h localhost -p 5432 -U postgres -d domainrag >/dev/null 2>&1; then
              echo "❌ PostgreSQL 미가용 (host=localhost:5432 db=domainrag)"
              echo "   AuthFusion postgres 컨테이너 또는 호스트 PG 상태 확인 필요"
              exit 1
            fi
            echo "  ✅ postgres reachable"

            echo ""
            echo "=== [3/6] 이미지 재빌드 (대상: $SERVICES) ==="
            if [ "$SKIP_BUILD" = "true" ]; then
              echo "  skip_build=true — 빌드 생략"
            else
              docker compose build $SERVICES 2>&1 | tail -20
            fi

            echo ""
            echo "=== [4/6] alembic 마이그레이션 ==="
            if [ "$RUN_MIGRATIONS" = "true" ]; then
              # backend 이미지에 alembic이 포함되어 있어야 함. 일회성 컨테이너로 실행.
              docker compose run --rm \
                -e POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal} \
                -e POSTGRES_PORT=5432 \
                -e POSTGRES_DB=domainrag \
                -e POSTGRES_ADMIN_USER=domainrag_platform_admin \
                -e POSTGRES_ADMIN_PASSWORD="${POSTGRES_ADMIN_PASSWORD}" \
                backend alembic upgrade head
            else
              echo "  run_migrations=false — 마이그레이션 생략"
            fi

            echo ""
            echo "=== [5/6] 컨테이너 재생성 (--no-deps 로 다른 서비스 보존) ==="
            docker compose up -d --force-recreate --no-deps $SERVICES

            echo ""
            echo "=== [6/6] 서비스별 헬스 대기 (서비스당 최대 180초) ==="
            FAIL=0
            for s in $SERVICES; do
              CID=$(docker compose ps -q $s | head -1)
              if [ -z "$CID" ]; then
                echo "❌ $s: container 없음 (compose service 이름 확인)"
                FAIL=1
                continue
              fi
              SVC_OK=false
              for i in {1..60}; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "missing")
                if [ "$STATUS" = "healthy" ]; then
                  echo "✅ $s healthy after ${i} probes"
                  SVC_OK=true
                  break
                fi
                if [ "$STATUS" = "unhealthy" ]; then
                  echo "❌ $s unhealthy"
                  docker logs "$CID" --tail 60
                  FAIL=1
                  break
                fi
                sleep 3
              done
              if [ "$SVC_OK" != "true" ] && [ "$STATUS" != "unhealthy" ]; then
                echo "❌ $s timeout (last status=$STATUS)"
                docker logs "$CID" --tail 60
                FAIL=1
              fi
            done

            echo ""
            echo "=== 최종 상태 ==="
            docker compose ps --format "table {{.Name}}\t{{.Status}}"

            [ $FAIL -eq 0 ] || { echo ""; echo "❌ 일부 서비스 헬시 실패"; exit 1; }
            echo ""
            echo "✅ 모든 대상 서비스 healthy"
