# ============================================================================
# Platform-level Retrieval 정책 (ADR-011 v2)
# ============================================================================
schema_version: 1

hybrid:
  fusion: dbsf                          # dbsf | rrf | weighted_sum (ADR-006/011)
  weights:
    dense: 0.5
    sparse: 0.5

top_k:
  dense: 30                             # prefetch
  sparse: 30                            # prefetch
  fused: 50                             # DBSF 결과
  rerank: 10                            # cross-encoder 재정렬 후
  context: 5                            # LLM에 전달

embedding:
  model: bge-m3
  dense_dim: 1024
  base_url_env: EMBEDDING_SERVER_URL    # .env에서 읽음

reranker:
  model: bge-reranker-v2-m3
  base_url_env: RERANKER_SERVER_URL
  enable: true                          # tenant 별 override 가능 (per-tenant disable)
  # ADR-011 §12 — 한국어 RAG 우선순위에서 reranker는 8순위(품질 보정 장치).
  # bge-reranker 시리즈가 모두 XLM-RoBERTa 기반이라 TEI FlashBert backend와
  # 비호환인 환경에선 platform_admin이 bypass: true로 전환 (또는 tenant override).
  # bypass=true이면 LangGraph rerank_context 노드 skip, Gate 1은 fused_score 기준.
  # 2026-05-29: 174에 reranker 컨테이너 미배포 → bypass=true. dense(+sparse) fused_score로
  # 검색·Gate 1 동작. reranker 기동 시 false로 복구. (한국어 RAG에서 reranker는 8순위 보정)
  bypass: true

query_rewriting:                        # ADR-011 §5 — tenant overrides로 활성화
  enable: false                         # 기본 false (도메인 평가 후 활성화)
  strategy: none                        # none | hyde | llm_expand
  llm:
    endpoint: tenant_slm                # tenant_slm | shared_llm
    max_tokens: 256
    temperature: 0.3
  hyde:
    instruction: "이 질문에 답할 때 적절한 가상 문서를 한 문단으로 작성하시오."
  llm_expand:
    instruction: "이 질문의 핵심 키워드와 동의어·관련어를 추출하시오."
    max_terms: 8
  prompt_yaml: configs/platform/prompts/query_rewrite.yaml

acl_filter:
  apply_at: prefetch_and_fusion         # ADR-011 §9 — 두 단계 모두 적용

availability:
  qdrant_timeout_seconds: 5
  embedding_timeout_seconds: 3
  reranker_timeout_seconds: 5
  on_qdrant_unavailable: fallback_503   # ADR-011 가용성 실패 핸들링
