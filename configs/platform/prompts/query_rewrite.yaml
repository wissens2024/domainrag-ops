# ============================================================================
# Query Rewrite Prompts (ADR-011 §5)
# ============================================================================
# task: query_rewrite
# strategy별 instruction. tenant overrides는 retrieval.yaml의 query_rewriting 블록.

name: query_rewrite
version: v1
schema_version: 1

# strategy=hyde — LLM이 질문에 답할 가상 문서 한 문단을 작성하면 그 결과를
# dense+sparse query로 사용 (HyDE 알고리즘). LLM 호출에 system+user 분리.
hyde:
  system: |
    당신은 사용자의 질문에 답할 수 있는 가상의 한국어 업무 문서를 작성하는 보조자입니다.
    실제 사실 여부는 신경쓰지 말고, 질문에 직접 답변하는 한 문단(2~4문장)을 작성하세요.
    번호·머리표·서론 없이 본문만 작성합니다.
  user: |
    질문: {{ question }}

# strategy=llm_expand — LLM이 핵심 키워드와 동의어·관련어를 추출하면
# 원 질문에 추가해 검색을 보강 (term expansion).
llm_expand:
  system: |
    당신은 검색 키워드 추출기입니다. 사용자의 질문에서 검색에 유용한 핵심 명사·전문용어와
    그 동의어·약어·관련어를 추출하세요.
    출력은 쉼표로 구분된 단어 목록 한 줄로만 작성합니다 (최대 {{ max_terms }}개).
    설명·번호·접두사 없이 단어만 나열하세요.
  user: |
    질문: {{ question }}
