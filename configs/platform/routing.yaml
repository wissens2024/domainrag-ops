# ============================================================================
# Platform-level Routing 룰 (ADR-013)
# ============================================================================
# 평가 순서: 위에서 아래로 첫 매칭. tenant overrides가 더 위에 삽입 가능.
schema_version: 1

default:
  model: tenant_slm
  use_lora: true
  use_rag: true
  ui_mode: chat_structured

# ADR-023: free_chat→streaming redirect 및 low_retrieval_confidence→refusal 룰 폐기.
# 모든 질의는 항상 검색하고, 근거 유무(Gate 1)로 grounded/ungrounded를 자동 분기한다.
# query_type=free_chat은 매칭 룰이 없으면 default(use_rag=true)로 흘러 검색 후
# 근거가 없으면 ungrounded 대화 경로로 처리된다.
rules:
  - name: simple_document_qa
    when:
      query_type: document_qa
      complexity: low
    use_model: tenant_slm
    use_lora: true
    use_rag: true
    ui_mode: chat_structured

  - name: synthesis_answer
    when:
      support_type: synthesis
      complexity: medium
    use_model: tenant_slm
    use_lora: true
    use_rag: true
    ui_mode: chat_structured

  - name: inference_answer
    when:
      support_type: inference
      complexity: high
    use_model: shared_llm                 # 큰 모델 (ADR-010 inference 검증 부담 ↑)
    use_lora: false
    use_rag: true
    ui_mode: chat_structured
    require_judge: true

  - name: assessment_generation
    when:
      query_type: assessment_generation
    use_model: shared_llm
    use_lora: false
    use_rag: true
    ui_mode: chat_structured
    require_similarity_check: true        # ADR-014
