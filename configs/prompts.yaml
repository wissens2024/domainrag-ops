# 프롬프트 템플릿 설정
# RAG 시스템에서 사용하는 모든 프롬프트 템플릿

# 시스템 프롬프트
system_prompt: |
  당신은 폐쇄망 환경에서 작동하는 전문적인 RAG 어시스턴트입니다.
  제공된 문맥 정보를 바탕으로 정확하고 신뢰할 수 있는 답변을 생성하세요.

  지침:
  - 제공된 문맥 정보만을 기반으로 답변하세요
  - 문맥에 없는 정보는 추측하지 마세요
  - 답변의 근거를 명확히 제시하세요
  - 전문적이고 친절한 톤을 유지하세요
  - 보안 관련 정보는 특히 주의해서 다루세요

# RAG 답변 생성 프롬프트
rag_prompt_template: |
  다음은 사용자의 질문과 관련 문맥 정보입니다:

  질문: {question}

  관련 문맥:
  {context}

  위 문맥 정보를 바탕으로 질문에 답변해주세요.
  답변 시 다음 사항을 준수하세요:

  1. 문맥 정보를 최대한 활용하세요
  2. 불확실한 정보는 명확히 표시하세요
  3. 답변의 근거를 설명하세요
  4. 간결하면서도 충분한 정보를 제공하세요

  답변:

# Citation 검증 프롬프트
citation_verification_prompt: |
  다음 답변과 제공된 문맥을 비교하여 Citation의 정확성을 검증하세요:

  답변: {answer}

  문맥 청크들:
  {chunks}

  검증 기준:
  1. 답변의 각 주장에 대한 근거가 문맥에 있는가?
  2. Citation 마커([1], [2] 등)가 올바르게 매핑되는가?
  3. 발췌문이 정확한가?

  검증 결과:
  - 정확한 Citation: [목록]
  - 부정확한 Citation: [목록]
  - 누락된 Citation: [목록]

# 질문 분류 프롬프트
question_classification_prompt: |
  다음 질문을 분석하여 카테고리를 분류하세요:

  질문: {question}

  분류 기준:
  - factual: 사실 기반 질문 (어떻게, 무엇을, 언제 등)
  - procedural: 절차/프로세스 관련 질문
  - policy: 정책/규정 관련 질문
  - technical: 기술적 세부사항
  - general: 일반적인 질문

  분류 결과 (한 단어로):
  카테고리: [factual|procedural|policy|technical|general]

  설명: [간단한 설명]

# 문서 요약 프롬프트
document_summary_prompt: |
  다음 문서를 요약해주세요:

  제목: {title}
  내용: {content}

  요약 요구사항:
  - 주요 내용을 3-5문장으로 요약
  - 핵심 키워드 추출
  - 대상 독자 고려 (내부 사용자)

  요약:

# 검색 쿼리 확장 프롬프트
query_expansion_prompt: |
  다음 검색 쿼리를 개선하여 더 효과적인 검색을 수행하세요:

  원본 쿼리: {query}

  개선 방법:
  1. 동의어 추가
  2. 관련 용어 포함
  3. 맥락 고려

  개선된 쿼리:

# 오류 응답 프롬프트
error_response_prompt: |
  시스템 오류가 발생했습니다. 사용자에게 친절하게 안내해주세요.

  오류 상황: {error_type}
  사용자 질문: {question}

  응답 지침:
  - 사과부터 시작
  - 가능한 해결 방법 제안
  - 추가 도움 요청
  - 전문적 태도 유지

# 재시도 프롬프트 (답변 품질 낮을 때)
retry_prompt_template: |
  이전 답변이 충분하지 않습니다. 더 나은 답변을 생성하세요:

  질문: {question}
  이전 답변: {previous_answer}
  추가 문맥: {additional_context}

  개선 요구사항:
  - 더 구체적인 정보 제공
  - 추가 예시 포함
  - 단계별 설명

  개선된 답변:

# 다국어 지원 프롬프트
multilingual_prompt: |
  사용자의 질문이 한국어가 아닌 경우 한국어로 답변하세요.
  단, 전문 용어는 원어를 유지하세요.

  원본 질문: {original_question}
  언어: {detected_language}

# 컨텍스트 제한 프롬프트
context_limit_prompt: |
  제공된 문맥이 제한적입니다. 가능한 범위 내에서 답변하세요.

  제한된 문맥: {limited_context}
  질문: {question}

  답변 전략:
  - 가능한 정보 제공
  - 추가 정보 필요성 언급
  - 관련 분야 제안

# 보안 필터링 프롬프트
security_filter_prompt: |
  답변 내용에 보안 문제가 없는지 확인하세요:

  답변 초안: {draft_answer}
  사용자 권한: {user_clearance}

  보안 체크:
  - 기밀 정보 유출 여부
  - 권한 초과 정보 포함 여부
  - 민감한 개인정보 노출 여부

  필터링 결과: [승인|거부|수정 필요]

# 평가 프롬프트
evaluation_prompt: |
  다음 답변의 품질을 평가하세요:

  질문: {question}
  답변: {answer}
  문맥: {context}

  평가 기준:
  - 정확성 (1-5)
  - 완전성 (1-5)
  - 관련성 (1-5)
  - 명확성 (1-5)

  종합 점수: [1-5]
  개선 제안: [텍스트]

# 채팅 히스토리 요약 프롬프트
chat_summary_prompt: |
  채팅 히스토리를 요약하여 컨텍스트를 유지하세요:

  히스토리: {chat_history}

  요약 요구사항:
  - 주요 질문과 답변
  - 해결되지 않은 문제
  - 사용자 선호사항
  - 최대 500자

  요약: