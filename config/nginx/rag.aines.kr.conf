# /etc/nginx/conf.d/rag.conf — DomainRAG Ops 운영 nginx config
# (2026-05-14 — ADR-016 §3 + ADR-017 URL 컨벤션)
#
# 도메인 정책:
#   - rag.aines.kr → frontend Next.js + backend FastAPI 단일 도메인 (path 분리)
#   - plane 분리는 path + JWT role (ADR-016 §3 RBAC):
#     · /{domain_id}/chat               → 일반 USER
#     · /{domain_id}/admin/*            → tenant ADMIN
#     · /platform/admin/*               → PLATFORM_ADMIN
#
# OIDC redirect_uri = https://rag.aines.kr/auth/callback (ADR-018 §2)
#   AuthFusion sso-server에 client_id 등록 시 동일 URI 사전 등록 필수.
#
# 운영 환경 (115, 풀-docker):
#   - 인증서: /home/ju/ssl/aines.kr.fullchain.sectigo.pem (wildcard *.aines.kr)
#             /home/ju/ssl/aines.kr.key.pem
#   - 백엔드 publish: backend(FastAPI) :8001 / frontend(Next.js) :3010
#                    qdrant :6333 / minio :9000~9001 (내부 docker network only)
#   - 포트 3010은 WiSentinel frontend(:3000)·AuthFusion admin-console(:3001)
#     충돌 회피용. 호스트 매핑만 3010, 컨테이너 내부 Next.js는 :3000 listen.
#   - 공인 IP: AuthFusion과 동일 host (192.168.0.115 → 182.208.133.142)
#
# DNS A 레코드: rag.aines.kr → 182.208.133.142
#
# 적용:
#   ssh ju@115
#   sudo cp /etc/nginx/conf.d/rag.conf{,.bak-$(date +%Y%m%d-%H%M)} 2>/dev/null || true
#   sudo cp ~/domainrag-ops/config/nginx/rag.aines.kr.conf /etc/nginx/conf.d/rag.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ─────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect (rag.aines.kr 만)
server {
    listen 80;
    server_name rag.aines.kr;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────
# rag.aines.kr — DomainRAG Ops (frontend + backend)
server {
    # nginx 1.25 미만 호환 — listen 줄에 `http2` 토큰 사용. 1.25+에선
    # deprecation warning이지만 여전히 동작. 새 문법 `http2 on;`은 1.25+ 전용.
    listen 443 ssl http2;
    server_name rag.aines.kr;
    server_tokens off;

    ssl_certificate     /home/ju/ssl/aines.kr.fullchain.sectigo.pem;
    ssl_certificate_key /home/ju/ssl/aines.kr.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Body size: 문서 업로드 대용량(PDF/스캔본) 허용. ADR-007 §2.
    client_max_body_size 200m;
    client_body_timeout  300s;

    # 공통 proxy 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ─── Backend API (FastAPI uvicorn :8001) ───────────────────────────
    # ADR-017 §1: /api/{domain_id}/..., /api/platform/admin/..., /api/auth/...
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
    }

    # SSE streaming (chat_streaming) — ADR-013 §6, ADR-017 §3.2
    # buffering off + read_timeout 길게 + X-Accel-Buffering: no (backend가 set)
    location ~ ^/api/[^/]+/chat/stream$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # OpenAPI / health (운영 진단)
    location = /api/health   { proxy_pass http://127.0.0.1:8001; }
    location /api/openapi.json { proxy_pass http://127.0.0.1:8001; }
    location /api/docs       { proxy_pass http://127.0.0.1:8001; }
    location /api/redoc      { proxy_pass http://127.0.0.1:8001; }

    # ─── Frontend Next.js (호스트 :3010, 컨테이너 내부 :3000) ──────────
    # WiSentinel frontend가 호스트 :3000을 점유하므로 DomainRAG는 :3010.
    # /auth/callback (ADR-018 §2) 포함 모든 path는 frontend가 라우팅.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

# ─────────────────────────────────────────────────────────────────────
# 검증:
#   curl -I https://rag.aines.kr/                                    # 200 (Next.js)
#   curl -I https://rag.aines.kr/api/health                          # 200 (FastAPI)
#   curl -I https://rag.aines.kr/api/auth/authorize/security         # 200 (mock) 또는 redirect (authfusion)
#   curl -I https://rag.aines.kr/api/platform/admin/endpoints        # 401/403 (인증 필요)
#   curl -N -H "Authorization: Bearer ..." \                          # SSE 토큰 스트림 (buffering off 확인)
#        -X POST https://rag.aines.kr/api/security/chat/stream \
#        -d '{"question":"테스트"}'
