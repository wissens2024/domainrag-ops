# ============================================================================
# Secret/API Key 정규식 룰 (ADR-020)
# ============================================================================
rules:
  # AWS Access Key
  - category: api_key
    severity: high
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    mask: "AKIA****************"

  # GitHub PAT (classic)
  - category: api_key
    severity: high
    pattern: '\bghp_[A-Za-z0-9]{36,}\b'
    mask: "ghp_****"

  # OpenAI API Key
  - category: api_key
    severity: high
    pattern: '\bsk-[A-Za-z0-9]{20,}\b'
    mask: "sk-****"

  # Generic Bearer token (JWT-like)
  - category: api_key
    severity: high
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    mask: "<JWT-masked>"

  # SSH Private Key 시작
  - category: api_key
    severity: high
    pattern: '-----BEGIN (?:RSA|OPENSSH|EC|DSA) PRIVATE KEY-----'
    mask: "<PRIVATE-KEY-masked>"
