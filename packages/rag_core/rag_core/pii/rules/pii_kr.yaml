# ============================================================================
# 한국 PII 정규식 룰 (ADR-020)
# WiSentinel dlp-core 포팅 + 자체 보강
# ============================================================================
rules:
  # 주민등록번호 (RRN)
  - category: rrn
    severity: high
    pattern: '\b\d{6}[-\s]?[1-4]\d{6}\b'
    mask: "******-*******"

  # 휴대전화 번호 (010, 011, 016~019)
  - category: phone
    severity: medium
    pattern: '\b01[016-9][-\s]?\d{3,4}[-\s]?\d{4}\b'
    mask: "010-****-****"

  # 일반 전화번호 (지역번호 포함)
  - category: phone
    severity: low
    pattern: '\b0[2-6][1-5]?[-\s]?\d{3,4}[-\s]?\d{4}\b'
    mask: "0**-***-****"

  # 이메일
  - category: email
    severity: low
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    mask: "***@***"

  # 신용카드 (16자리, 4-4-4-4 또는 연속)
  - category: credit_card
    severity: high
    pattern: '\b(?:\d{4}[-\s]?){3}\d{4}\b'
    mask: "****-****-****-****"

  # 한국 계좌번호 (은행별 가변 — 가장 일반적인 형식)
  - category: account_number
    severity: high
    pattern: '\b\d{3}[-\s]?\d{2,6}[-\s]?\d{6,8}\b'
    mask: "***-****-******"

  # 운전면허번호 (12자리)
  - category: driver_license
    severity: high
    pattern: '\b\d{2}[-\s]?\d{2}[-\s]?\d{6}[-\s]?\d{2}\b'
    mask: "**-**-******-**"

  # 여권번호 (1글자 + 8자리)
  - category: passport
    severity: high
    pattern: '\b[A-Z]\d{8}\b'
    mask: "*********"

  # IP 주소 (IPv4)
  - category: ip_address
    severity: low
    pattern: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
    mask: "***.***.***.***"

  # 사번 (E + 5~7자리, 또는 대문자 prefix + 숫자)
  - category: employee_id
    severity: medium
    pattern: '\b[A-Z]{1,3}\d{5,7}\b'
    mask: "********"
