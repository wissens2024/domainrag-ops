# ============================================================================
# DomainRAG Ops — 115번 서버 override compose
# ============================================================================
# 115에서는 PostgreSQL을 *기존 ai_aware_sse_postgres 컨테이너*와 공유한다
# (ADR-019 §1 + feedback_115_postgres_shared 메모리).
# 본 override는 base compose의 `postgres` service를 비활성화하고 backend가
# 외부 PG 컨테이너에 접속하도록 env를 재구성한다.
#
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.115.yml up -d \
#     qdrant minio backend frontend
#
# 사전 조건:
#   - ai_aware_sse_postgres 컨테이너가 같은 호스트에서 운영 중
#   - 같은 docker network에 attach (또는 host_network 사용)
#   - `domainrag` database + 두 role(`domainrag_app`/`domainrag_platform_admin`)이
#     이미 생성된 상태 (init_postgres.sql 1회 적용)
# ============================================================================

services:
  # postgres service 비활성화 — 외부 ai_aware_sse_postgres 사용
  postgres:
    profiles: ["disabled"]   # 기본 시동에서 제외
    image: postgres:16-alpine
    # 본 service는 활성화하지 않는다. profile flag 없이 up하면 무시됨.

  backend:
    environment:
      # 외부 PG 가리키기
      - ENV=production
      - LOG_LEVEL=INFO
      - CONFIG_DIR=/workspace/configs
      # CLAUDE.md Y4 — logs/uvicorn timestamp KST 표기. DB는 UTC TIMESTAMPTZ 유지
      # (instant는 동일, application 코드의 명시적 KST 변환과 무관).
      - TZ=Asia/Seoul
      - POSTGRES_HOST=ai_aware_sse_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=domainrag
      - POSTGRES_USER=domainrag_app
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_ADMIN_USER=domainrag_platform_admin
      - POSTGRES_ADMIN_PASSWORD=changeme_admin
      # 나머지는 base compose 그대로
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=domainrag
      - MINIO_SECRET_KEY=changeme_minio_root
      - MINIO_BUCKET=domainrag
      # 같은 내부망 — DNS(174.local) 의존 끊고 IP 직접
      - TENANT_SLM_BASE_URL=http://192.168.0.174:8000/v1
      - SHARED_LLM_BASE_URL=http://192.168.0.174:8000/v1
      - EMBEDDING_SERVER_URL=http://192.168.0.174:8082
      - RERANKER_SERVER_URL=http://192.168.0.174:8083
      # 174 vLLM(8000) 가동 확인됨. embedding/reranker(8082/8083)는 미가동
      # — retrieval은 fail하지만 chat_streaming mode는 LLM만 호출하므로 동작
      - RAG_BACKEND=production
      # 174 vLLM의 실제 model id (`Qwen/Qwen2.5-7B-Instruct-AWQ`)와 일치시킴
      - RAG_DEFAULT_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ
      # AuthFusion OIDC — .env가 compose interpolation으로 주입 (base의 APP_BASE_URL override).
      # 운영 .env 필수 키: AUTHFUSION_CLIENT_ID, AUTHFUSION_CLIENT_SECRET, AUTHFUSION_ISSUER,
      # AUTHFUSION_DISCOVERY_URL, APP_BASE_URL, OIDC_REQUIRE_VERIFIED_EMAIL.
      - AUTH_MODE=oidc
      - APP_BASE_URL=${APP_BASE_URL:-https://rag.aines.kr}
      - AUTHFUSION_ISSUER=${AUTHFUSION_ISSUER:-https://api.aines.kr}
      - AUTHFUSION_DISCOVERY_URL=${AUTHFUSION_DISCOVERY_URL:-}
      - AUTHFUSION_CLIENT_ID=${AUTHFUSION_CLIENT_ID:-}
      - AUTHFUSION_CLIENT_SECRET=${AUTHFUSION_CLIENT_SECRET:-}
      - OIDC_REQUIRE_VERIFIED_EMAIL=${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      - LEDGER_ENABLE=false
      - OPS_CRON_MODE=external  # 운영은 외부 cron 권장
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 외부 ai_aware_sse_postgres 컨테이너와 같은 network 사용
    networks:
      - domainrag-network
      - ai-aware-sse_default  # WiSentinel network에 attach (실제 이름 확인 필요)

  # ──────────────────────────────────────────────────────────────────────
  # Frontend — 운영 same-origin API base
  # ──────────────────────────────────────────────────────────────────────
  # base compose는 NEXT_PUBLIC_API_URL=http://localhost:8001로 박혀 있어
  # 운영 브라우저가 backend를 찾지 못한다. nginx rag.aines.kr.conf가
  # /api/*를 backend로 proxy하므로 same-origin URL로 override.
  # Dockerfile.frontend는 `npm run dev` 기동이라 runtime env가 그대로 읽힌다.
  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=${APP_BASE_URL:-https://rag.aines.kr}
      - NEXT_PUBLIC_ENVIRONMENT=production

networks:
  ai-aware-sse_default:
    external: true   # 이미 존재하는 외부 network — 이름은 운영자가 확인 후 정정
